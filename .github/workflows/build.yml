name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify G17 model and textures
        run: python3 scripts/check_g17_assets.py

      - name: Verify optional licensed G17 importer syntax
        run: python3 -m py_compile tools/import_tacz_g17.py

      - name: Verify native TaCZ integration and legacy G17 isolation
        run: python3 scripts/check_tacz_native.py

      - name: Verify exact TaCZ 1.21.1 gun and attachment compatibility
        run: python3 scripts/check_tacz_weapon_catalog.py

      - name: Verify exact weapon loot probabilities
        run: python3 -m unittest discover -s scripts -p 'test_loot_gun_rates.py' -v

      - name: Test one-file modpack packaging (offline)
        run: python3 -m unittest discover -s scripts -p 'test_modpack.py' -v

      - name: Build with Gradle
        run: bash ./gradlew build

      - name: Assemble Zombie Apocalypse SMP modpack
        run: |
          python3 scripts/build_modpack.py \
            --jar-dir build/libs \
            --output dist/Zombie-Apocalypse-SMP.mrpack \
            --commit "$GITHUB_SHA"

      - name: Upload one-file modpack for players
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Apocalypse-SMP-Modpack
          path: dist/Zombie-Apocalypse-SMP.mrpack
          if-no-files-found: error
          retention-days: 30