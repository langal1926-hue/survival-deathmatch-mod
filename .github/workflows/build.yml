name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify G17 model and textures
        run: python3 scripts/check_g17_assets.py

      - name: Verify optional licensed G17 importer syntax
        run: python3 -m py_compile tools/import_tacz_g17.py

      - name: Build with Gradle
        run: bash ./gradlew build