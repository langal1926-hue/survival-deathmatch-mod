name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify G17 model and textures
        run: python3 scripts/check_g17_assets.py

      - name: Verify optional licensed G17 importer syntax
        run: python3 -m py_compile tools/import_tacz_g17.py

      - name: Verify native TaCZ integration and legacy G17 isolation
        run: python3 scripts/check_tacz_native.py

      - name: Verify exact TaCZ 1.21.1 gun and attachment compatibility
        run: python3 scripts/check_tacz_weapon_catalog.py

      - name: Test one-file modpack packaging (offline)
        run: python3 -m unittest discover -s scripts -p 'test_modpack.py' -v

      - name: Build with Gradle
        run: |
          set -o pipefail
          bash ./gradlew build runGameTestServer 2>&1 | tee build-output.log

      - name: Report build and test results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def annotation(level, message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level}::{escaped}')

          log = Path('build-output.log')
          if log.exists() and 'BUILD FAILED' in log.read_text():
              annotation('error', '\n'.join(log.read_text().splitlines()[-70:]))
          if log.exists():
              for line in log.read_text().splitlines():
                  if any(text in line.lower() for text in ('gametest', 'tests passed', 'tests failed', 'tests done', 'tests complete', 'required test', 'survivalrestrictionstest', '> task :test')):
                      annotation('notice', line)
          suites = [ET.parse(path).getroot() for path in Path('build/test-results/test').glob('TEST-*.xml')]
          if not suites:
              annotation('error', 'No JUnit result XML was produced; the build must execute its regression tests.')
              raise SystemExit(1)
          if suites:
              counts = {key: sum(int(suite.get(key, 0)) for suite in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              result = 'NeoForge JUnit: ' + ', '.join(f'{key}={value}' for key, value in counts.items())
              annotation('notice', result)
              if counts['tests'] < 2 or counts['skipped'] or counts['failures'] or counts['errors']:
                  raise SystemExit('Required JUnit checks did not all pass')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(result + '\n')
              for suite in suites:
                  for failure in list(suite.iter('failure')) + list(suite.iter('error')):
                      annotation('error', (failure.text or failure.get('message', 'Test failed'))[:6000])
          PY

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build-output.log
            build/reports/tests/
            build/test-results/
          retention-days: 7

      - name: Assemble Zombie Apocalypse SMP modpack
        run: |
          python3 scripts/build_modpack.py \
            --jar-dir build/libs \
            --output dist/Zombie-Apocalypse-SMP.mrpack \
            --commit "$GITHUB_SHA"

      - name: Upload one-file modpack for players
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Apocalypse-SMP-Modpack
          path: dist/Zombie-Apocalypse-SMP.mrpack
          if-no-files-found: error
          retention-days: 30
